<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VMPix Testing Portfolio</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #03040a;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      font-family: "Orbitron", Arial, sans-serif;
      color: rgba(235, 245, 255, 0.92);
    }

    .testing-shell {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 140, 180, 0.12), transparent 30%),
        radial-gradient(circle at 18% 82%, rgba(96, 218, 255, 0.08), transparent 22%),
        linear-gradient(180deg, #040308 0%, #090611 42%, #05060c 100%);
    }

    .testing-frame {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <main class="testing-shell">
    <iframe
      class="testing-frame"
      src="/archive-explorer-mockup.html"
      title="VMPix Interactive Portfolio Testing"
      loading="eager"
      allowfullscreen
    ></iframe>
  </main>
</body>
</html>
