<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>VMPix Home Mockup</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .home-mock-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .home-mock-fallback {
      position: fixed;
      inset: auto 12px 12px 12px;
      padding: 10px 12px;
      color: rgba(255, 255, 255, 0.86);
      background: rgba(0, 0, 0, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
    }

    .home-mock-fallback a {
      color: #9fe8ff;
    }
  </style>
</head>
<body>
  <iframe
    class="home-mock-frame"
    src="../archive-explorer-mockup.html"
    title="VMPix Home Mockup"
    loading="eager"
    allowfullscreen
  ></iframe>
  <noscript>
    <div class="home-mock-fallback">
      JavaScript is disabled. Open <a href="../archive-explorer-mockup.html">the home mockup</a>.
    </div>
  </noscript>
</body>
</html>
