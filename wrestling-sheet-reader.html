<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VMPix New Sheet Bands Index</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b11;
      --panel: rgba(19, 23, 32, 0.88);
      --panel-soft: rgba(255, 255, 255, 0.045);
      --line: rgba(255, 255, 255, 0.12);
      --text: rgba(245, 248, 252, 0.94);
      --muted: rgba(206, 216, 226, 0.68);
      --accent: #ff4f84;
      --accent-2: #67e8c9;
      --danger: #ff7b7b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(255, 79, 132, 0.18), transparent 32%),
        radial-gradient(circle at 78% 12%, rgba(103, 232, 201, 0.11), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .topbar {
      display: grid;
      gap: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(23, 27, 39, 0.92), rgba(10, 12, 19, 0.9));
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.36);
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .lede {
      margin: 0;
      max-width: 840px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    input {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: rgba(103, 232, 201, 0.64);
      box-shadow: 0 0 0 3px rgba(103, 232, 201, 0.12);
    }

    button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid rgba(255, 79, 132, 0.42);
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(255, 79, 132, 0.96), rgba(196, 43, 90, 0.92));
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .chip {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .chip strong {
      color: var(--text);
    }

    .status {
      margin-top: 16px;
      min-height: 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status[data-tone="ok"] {
      color: var(--accent-2);
    }

    .status[data-tone="error"] {
      color: var(--danger);
    }

    .tableShell {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .tableScroll {
      overflow: auto;
      max-height: calc(100vh - 250px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      text-align: left;
      vertical-align: top;
      font-size: 13px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(12, 15, 23, 0.98);
      color: var(--accent-2);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    tbody tr:nth-child(even) {
      background: var(--panel-soft);
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .jsonPreview {
      min-height: 320px;
      margin: 0;
      padding: 16px;
      color: rgba(245, 248, 252, 0.94);
      font: 12px/1.45 Consolas, "Liberation Mono", Menlo, monospace;
      white-space: pre;
      tab-size: 2;
    }

    @media (max-width: 720px) {
      main {
        width: min(100% - 18px, 1180px);
        padding-top: 12px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="topbar">
      <div>
        <h1>New Sheet Bands Index</h1>
        <p class="lede">Backend JSON reader for the new published sheet. The server reads the CSV, normalizes it, and exposes the result here as an index payload.</p>
      </div>

      <div class="controls">
        <input id="endpointUrl" type="url" spellcheck="false" aria-label="Backend JSON endpoint" value="https://music-archive-3lfa.onrender.com/index/new-sheet/bands?force=1">
        <button id="loadBtn" type="button">Load JSON</button>
      </div>

      <div class="meta" aria-live="polite">
        <span class="chip">Count <strong id="rowCount">0</strong></span>
        <span class="chip">Generated <strong id="generatedAt">None</strong></span>
        <span class="chip">Payload <strong id="payloadType">Unknown</strong></span>
        <span class="chip">Method <strong id="loadMethod">Ready</strong></span>
      </div>
    </section>

    <div id="status" class="status">Ready to load the backend JSON endpoint.</div>

    <section class="tableShell" aria-label="JSON preview">
      <div id="tableMount" class="tableScroll">
        <pre id="jsonMount" class="jsonPreview">No JSON loaded yet.</pre>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var els = {
        input: document.getElementById("endpointUrl"),
        button: document.getElementById("loadBtn"),
        status: document.getElementById("status"),
        table: document.getElementById("tableMount"),
        json: document.getElementById("jsonMount"),
        rowCount: document.getElementById("rowCount"),
        generatedAt: document.getElementById("generatedAt"),
        payloadType: document.getElementById("payloadType"),
        loadMethod: document.getElementById("loadMethod")
      };

      function setStatus(message, tone) {
        els.status.textContent = message || "";
        if (tone) els.status.setAttribute("data-tone", tone);
        else els.status.removeAttribute("data-tone");
      }

      function formatGeneratedAt(value) {
        var raw = String(value || "").trim();
        if (!raw) return "None";
        var dt = new Date(raw);
        if (Number.isNaN(dt.getTime())) return raw;
        try {
          return dt.toLocaleString();
        } catch (_) {
          return raw;
        }
      }

      function getPayloadInfo(data) {
        var src = data && typeof data === "object" ? data : {};
        var keys = ["bands", "shows", "people", "items", "results"];
        for (var i = 0; i < keys.length; i += 1) {
          var key = keys[i];
          if (Array.isArray(src[key])) {
            return { key: key, count: Number(src.count || src[key].length || 0) };
          }
          if (src[key] && typeof src[key] === "object") {
            var groupedCount = Object.keys(src[key]).reduce(function (total, groupKey) {
              var group = src[key][groupKey];
              if (Array.isArray(group)) return total + group.length;
              if (group && typeof group === "object") {
                if (group.band_id && typeof group.band_id === "object") {
                  return total + Object.keys(group.band_id).length;
                }
                return total + Object.keys(group).length;
              }
              return total;
            }, 0);
            return { key: key, count: Number(src.count || groupedCount || 0) };
          }
        }
        return { key: "object", count: Number(src.count || 0) };
      }

      function renderJson(data) {
        var info = getPayloadInfo(data);
        els.rowCount.textContent = String(Number.isFinite(info.count) ? info.count : 0);
        els.generatedAt.textContent = formatGeneratedAt(data && data.generatedAt);
        els.payloadType.textContent = info.key;
        els.json.textContent = JSON.stringify(data || {}, null, 2);
      }

      async function fetchIndexJson(endpointUrl) {
        var res = await fetch(endpointUrl, {
          cache: "no-store",
          headers: { Accept: "application/json" }
        });
        var text = await res.text();
        if (!res.ok) {
          throw new Error("Endpoint returned HTTP " + res.status + (text ? ": " + text.slice(0, 180) : ""));
        }
        try {
          return JSON.parse(text || "{}");
        } catch (err) {
          throw new Error("Endpoint did not return valid JSON.");
        }
      }

      async function loadIndexJson() {
        var url = String(els.input.value || "").trim();
        if (!url) {
          setStatus("Paste a backend JSON endpoint first.", "error");
          return;
        }

        els.button.disabled = true;
        els.loadMethod.textContent = "Loading";
        setStatus("Loading backend JSON...", "");

        try {
          var data = await fetchIndexJson(url);
          var info = getPayloadInfo(data);
          renderJson(data);
          els.loadMethod.textContent = "JSON";
          setStatus("Loaded " + info.count + " " + info.key + " from the backend index endpoint.", "ok");
        } catch (err) {
          els.rowCount.textContent = "0";
          els.generatedAt.textContent = "None";
          els.payloadType.textContent = "Unknown";
          els.loadMethod.textContent = "Failed";
          els.json.textContent = "JSON could not be loaded.";
          setStatus((err && err.message) ? err.message : "JSON could not be loaded.", "error");
        } finally {
          els.button.disabled = false;
        }
      }

      els.button.addEventListener("click", loadIndexJson);
      els.input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") loadIndexJson();
      });
      loadIndexJson();
    })();
  </script>
</body>
</html>
