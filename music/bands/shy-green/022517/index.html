<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <base href="/" />
  <title>Voodoo Media</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
  /* =============================
   IMPORTS (moved to <link> tags in <head> for faster mobile first paint)
   ============================= */
  

  /* =============================
   THEME TOKENS
   ============================= */
  :root {
    --bg: #050608;
    --fg: rgba(226,232,240,0.92);
    --border: rgba(255,255,255,0.14);
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --radius: 18px;

    /* Device-aware viewport height helper (mobile-safe) */
    --vh: 1vh;
  }

  /* =============================
   HUD TOKENS (LOGBOOK HUD)
   ============================= */
  :root {
    /* HUD palette (red) */
    --hud-bg: #040405;
    --hud-bg2: #07070a;
    --hud-panel: rgba(12, 7, 9, .72);
    --hud-panel2: rgba(18, 8, 10, .55);

    --hud-r1:#ff2a2a;
    --hud-r2:#ff4c4c;
    --hud-r3:#ff9a9a;

    --hud-line: rgba(255, 60, 60, .28);
    --hud-line2: rgba(255, 60, 60, .16);
    --hud-txt: rgba(255, 210, 210, .92);
    --hud-muted: rgba(255, 210, 210, .62);

    --hud-glow: 0 0 18px rgba(255,60,60,.42), 0 0 48px rgba(255,60,60,.16);
    --hud-shadow: 0 14px 40px rgba(0,0,0,.55);
    --hud-radius: 18px;
  }

  /* =============================
   BASE RESET
   ============================= */
  * { box-sizing: border-box; }

  /* =============================
   PAGE BACKGROUND + TYPOGRAPHY
   ============================= */
  html, body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      radial-gradient(1200px 700px at 50% 20%, rgba(255,0,0,0.10), transparent 60%),
      radial-gradient(900px 500px at 30% 80%, rgba(0,170,255,0.10), transparent 55%),
      linear-gradient(180deg, rgba(0,0,0,0.62), rgba(0,0,0,0.72));
    background-size: auto, auto, auto, cover;
    background-position: center, center, center, center;
    background-repeat: no-repeat;
    background-attachment: scroll, scroll, scroll, fixed;



/* Mobile/WebView fix: `background-attachment: fixed` can break layout/scroll in some in-app browsers (Messenger, etc.) */
@media (max-width: 600px){
  html, body{
    background-attachment: scroll, scroll, scroll, scroll !important;
  }
}
    color: var(--fg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  /* =============================
   APP SHELL / VIEWS
   ============================= */
  #app { min-height: 100%; display: grid; }
  .view { display: none; min-height: 100vh; }
  .view.active { display: grid; }
  #view-home { grid-template-rows: auto 1fr; }

  /* =============================
   HEADER / BRAND BAR
   ============================= */
  header {
    position: sticky;
    top: 0;
    backdrop-filter: blur(10px);
    background: rgba(0,0,0,0.35);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 10px 18px 12px;
    z-index: 5;
    display: grid;
    justify-items: center;
    gap: 8px;
  }

  .brandLink { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer; }
  .brandImg { height: 100px; width: auto; display: block; }

  /* =============================
   HUD LAYOUT / STAGE
   ============================= */
  .hudStage{
    /* Flush HUD to top of page (no vertical centering / no top padding) */
    min-height: calc(var(--vh) * 100);
    display: grid;
    justify-items: center;
    align-items: start;
    padding: 0;
  }

  .hud{
    width: min(1080px, 100%);
    /* Make the HUD fill the usable screen height (device-aware) */
    height: calc(var(--vh) * 100);

    border-radius: 22px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--hud-shadow);
    background: radial-gradient(1200px 700px at 55% 35%, #1a070a 0%, var(--hud-bg) 55%, #020203 100%);

    /* Boot/open animation (whole HUD) */
    opacity: 0;
    transform: translateY(10px) scale(.985);
    filter: none;
    transform-origin: top center;
    will-change: transform, opacity, filter;
    animation: hudBootIn 1100ms ease-out 120ms forwards;
  }

  .hud::before{
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(900px 520px at 50% 40%, rgba(255,40,40,.08), transparent 60%),
      radial-gradient(1200px 900px at 50% 80%, rgba(255,40,40,.06), transparent 65%),
      linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.60));
    pointer-events: none;
  }

  .hud::after{
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.035) 0px,
        rgba(255,255,255,.035) 1px,
        rgba(0,0,0,0) 3px,
        rgba(0,0,0,0) 6px
      );
    mix-blend-mode: overlay;
    opacity: .08;
    pointer-events: none;
  }

  .hudSweep{
    position: absolute;
    left: 0;
    right: 0;
    top: -20%;
    height: 22%;
    background: linear-gradient(
      to bottom,
      rgba(255,60,60,0) 0%,
      rgba(255,60,60,.10) 45%,
      rgba(255,60,60,.16) 50%,
      rgba(255,60,60,.10) 55%,
      rgba(255,60,60,0) 100%
    );
    opacity: .0;
    mix-blend-mode: screen;
    pointer-events: none;
    filter: blur(0.4px);
    animation: hudAmbientSweep 4s ease-in-out 2.2s infinite;
  }

  .hudNoise{
    position: absolute;
    inset: 0;
    background-image:
      url("data:image/svg+xml,%3Csvg xmlns='https://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
    opacity: .07;
    mix-blend-mode: overlay;
    pointer-events: none;
    animation: hudNoiseDrift 3.2s steps(2,end) infinite;
  }

  .hudFrame{
    position: absolute;
    inset: 0;
    border-radius: 22px;
    border: 2px solid rgba(255,60,60,.28);
    box-shadow: inset 0 0 0 1px rgba(255,60,60,.10), inset 0 0 36px rgba(255,60,60,.08);
    pointer-events: none;
  }

  .hudFrameCorners::before,
  .hudFrameCorners::after{
    content: "";
    position: absolute;
    width: 46%;
    height: 30%;
    border: 2px solid rgba(255,60,60,.22);
    border-bottom: none;
    border-left: none;
    border-top-right-radius: 28px;
    top: -1px;
    right: -1px;
    filter: drop-shadow(0 0 10px rgba(255,60,60,.22));
    pointer-events: none;
  }

  .hudFrameCorners::after{
    border-top: none;
    border-right: none;
    border-bottom-left-radius: 28px;
    bottom: -1px;
    left: -1px;
    top: auto;
    right: auto;
  }

  .hudContent{
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows:  74px auto 1fr;
    padding: 14px 16px;
    gap: 12px;
    color: var(--hud-txt);
  }

  /* =============================
   HUD TOPBAR (brand)
   ============================= */
  .hudTopbar{
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--hud-radius);
    border: 1px solid rgba(255,60,60,.22);
    background: linear-gradient(180deg, rgba(18,8,10,.72), rgba(10,6,7,.55));
    box-shadow: inset 0 0 0 1px rgba(255,60,60,.08);
  }

  .hudBrandLink{
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .hudBrandImg{
    height: 100px;
    width: auto;
    display: block;
    filter: drop-shadow(0 0 12px rgba(255,60,60,.35));
  }

  /* =============================
   HUD CONTENT (reveal + sweep)
   ============================= */
  .hudTopbar,
  .hudContent > :nth-child(2),
  .hudContent > :nth-child(3){
    opacity: 0;
    will-change: transform, opacity, filter;
  }

  .hudTopbar,
  .hudStub{
    font-size: 14px;
    border-width: 2px;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }

  .hudTopbar > *,
  .hudStub > *{
    position: relative;
    z-index: 2;
  }

  .hudTopbar::after,
  .hudStub::after{
    content: "";
    position: absolute;
    inset: -35% -25%;
    background: linear-gradient(90deg, transparent, rgba(255,60,60,.28), transparent);
    transform: translateX(-80%) rotate(-10deg);
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    z-index: 3;
  }

  .hudTopbar{
    transform: translateY(-8px);
    animation: hudTopbarIn 540ms ease-out 720ms forwards;
  }

  .hudContent > :nth-child(2){
    transform: translateY(10px);
    animation: hudSectionIn 600ms cubic-bezier(.2,.8,.2,1) 820ms forwards;
  }

  .hudContent > :nth-child(3){
    transform: translateY(8px);
    animation: hudFooterIn 540ms ease-out 940ms forwards;
  }

  .hudTopbar::after{ animation: hudScanSweep 1100ms ease-in-out 760ms 1; }
  .hudContent > :nth-child(2)::after{ animation: hudScanSweep 1200ms ease-in-out 860ms 1; }
  .hudContent > :nth-child(3)::after{ animation: hudScanSweep 1200ms ease-in-out 980ms 1; }

  /* =============================
   HUD INTRO PILLS (tabs)
   ============================= */
/* =============================
   NAV ICONS (minimal, inherits neon)
   ============================= */
  .nav-icon{
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
    opacity: 0.9;
    filter: drop-shadow(0 0 6px rgba(255,60,60,.18));
    transition: transform 180ms ease, opacity 180ms ease, filter 180ms ease;
  }
  .hudIntroText:hover .nav-icon{
    transform: translateY(-1px);
    opacity: 1;
    filter: drop-shadow(0 0 10px rgba(255,60,60,.30));
  }
  .hudIntroText:active .nav-icon{
    transform: translateY(0px);
  }
  @media (prefers-reduced-motion: reduce){
    .nav-icon{ transition: none !important; }
  }

  .hudIntroText{
    text-align: center;
    display: inline-block;
    white-space: nowrap;
    padding: 5px 10px;
    border: 1px solid rgba(255,60,60,.32);
    border-radius: var(--hud-radius);
    background: rgba(0,0,0,.18);
	text-decoration: none;
    color: inherit;
    cursor: pointer;
    position: relative;

    transition: transform 120ms ease, box-shadow 180ms ease, border-color 180ms ease, background 180ms ease, filter 180ms ease;
  }

  /* =============================
   CINEMATIC NAV (premium):
   - Magnetic micro-motion (driven by --tx/--ty in JS)
   - Single sliding underline rail (injected by JS)
   - Extra depth/gloss (no layout changes)
   ============================= */
  .hudContent > .hudStub:not(.hudMain){
    position: relative;
    isolation: isolate;
  }

  /* Subtle nav-local atmosphere behind pills (static, engineered) */
  .hudContent > .hudStub:not(.hudMain)::before{
    content: "";
    position: absolute;
    inset: -22px -18px;
    z-index: 0;
    pointer-events: none;
    opacity: .55;
    filter: blur(14px);
    background:
      radial-gradient(40% 70% at 18% 60%, rgba(0,255,255,0.10), transparent 60%),
      radial-gradient(46% 70% at 82% 55%, rgba(160,70,255,0.09), transparent 62%),
      radial-gradient(60% 90% at 50% 140%, rgba(255,60,80,0.14), transparent 58%);
  }

  /* Sliding underline rail (element is injected by JS into the nav stub) */
  .hudNavUnderline{
    /* Disabled (user request: remove underline). Kept for easy re-enable later. */
    display: none !important;
    position: absolute;
    left: 0;
    top: 100%;
    margin-top: 8px;
    height: 2px;
    width: 10px;
    border-radius: 999px;
    background: linear-gradient(90deg,
      rgba(255,80,120,0.0),
      rgba(255,90,130,0.75),
      rgba(0,210,255,0.55),
      rgba(255,80,120,0.0)
    );
    opacity: 0;
    transform: translate3d(var(--ux, 0px), 0, 0);
    box-shadow:
      0 0 14px rgba(255,90,130,0.32),
      0 0 22px rgba(0,210,255,0.18);
    will-change: transform, width, opacity;
    transition:
      transform 420ms cubic-bezier(.2,.85,.2,1),
      width 420ms cubic-bezier(.2,.85,.2,1),
      opacity 180ms ease;
    pointer-events: none;
    z-index: 3;
  }
  .hudNavUnderline.is-on{ opacity: 1; }

  /* Magnetic micro-motion (JS sets --tx/--ty per pill) */
  .hudIntroText{
    transform: translate3d(var(--tx, 0px), var(--ty, 0px), 0);
    will-change: transform;
  }
  .hudIntroText:hover{
    /* subtle hover lift */
    transform: translate3d(var(--tx, 0px), calc(var(--ty, 0px) - 2px), 0);
  }
  .hudIntroText:active{
    transform: translate3d(0px, 1px, 0);
  }

  /* Reinforce gloss sweep (already present) when active, without extra noise */
  .hudIntroText.is-active::after{
    opacity: 1;
    animation: pillSheen 920ms ease-out;
  }

  .hudIntroText.is-active{
    background: linear-gradient(180deg, rgba(255,60,60,.18), rgba(0,0,0,.14));
    border-color: rgba(255,60,60,.45);
    box-shadow:
      0 0 0 1px rgba(255,60,60,.20),
      0 0 24px rgba(255,60,60,.28),
      inset 0 0 22px rgba(255,60,60,.20);
    filter: brightness(1.06);
    animation: hudPillActivate 220ms ease-out;
  }

  .hudIntroText:active{ transform: translateY(1px); }

  .hudIntroType{
    display: inline-block;
    white-space: nowrap;
    overflow: hidden;
    width: 0ch;
    animation: hudTypeIn 420ms steps(var(--intro-chars), end) 720ms forwards;
  }

  .hudContent > :nth-child(2){
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent;
    border: none;
  }

  .hudContent > :nth-child(2),
  .hudContent > :nth-child(3){
    font-family: 'Orbitron', system-ui, sans-serif;
  }

  /* =============================
   HUD MAIN
   ============================= */
  /* =============================
   HUD MAIN (PLAIN) â€“ neon frame removed
   ============================= */
  .hudMainPlain{
    width: 100%;
    max-width: min(760px, 92%);
    margin: 0 auto;
    display: grid;
    place-items: center;
    padding: 18px 20px;
    text-align: center;
  }

  .hudMain{
    border: 1px solid rgba(255,60,60,.32);
    background: rgba(0,0,0,.18);
    padding: 5px;
    font-size: 15px;
    border-radius: var(--hud-radius);
  }

  .hudMainTextBox{
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    padding: 0 22px;
  }

  [data-hud-main-text]{
    position: relative;
    display: block;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: break-word;
    hyphens: auto;
    text-align: center;
  }

  /* =============================
   HUD MAIN TEXT SAFETY
   Ensures Home text is visible even if a route module momentarily clears the mount
   ============================= */
  #hudMainMount{ width:100%; }
  .neonFrameTextInner{ min-height: 56px; }
  [data-hud-main-text]{ opacity: 1 !important; }


  .hudMain{
    padding-left: 10px;
    padding-right: 10px;
  }

  .hudMainLoad{
    display: block;
    width: 100%;
    will-change: transform, opacity, filter;
    opacity: 0;
    transform: translateY(18px);
    filter: blur(1px);
    animation: hudMainScrollBoot 820ms ease-out 1040ms forwards;
  }

  .hudMainType{
    display: flex;
    flex-direction: column;
    align-items: center;

    width: 100%;
    max-width: 100%;

    overflow: visible;
    letter-spacing: .10em;
    text-transform: none;
  }

  .hudLineOuter{
    display: block;
    width: 100%;
    max-width: 100%;
    text-align: center;
    overflow: visible;
  }

  .hudLineInner{
    display: inline-block;
    white-space: normal;
    overflow: visible;
    max-width: 100%;
    overflow-wrap: anywhere;
    word-break: break-word;

    width: auto;
    opacity: 0;
  }

  .hudLine:last-child::after{
    content: "";
    display: inline-block;
    width: 0.6ch;
    height: 1em;
    margin-left: 0.3ch;
    border-right: 2px solid rgba(255, 210, 210, .85);
    transform: translateY(1px);
    animation: hudCaretBlink 640ms steps(2, end) calc(var(--last-line-delay) + 240ms) infinite;
  }

  [data-hud-main-text].isTyping::after{
    content: "â–Œ";
    display: inline-block;
    margin-left: 2px;
    transform: translateY(1px);
    animation: hudCaretBlink 850ms steps(1, end) infinite;
  }

  .hudStub{
  display: grid;
  place-items: center;
  border-radius: var(--hud-radius);

  /* OUTER BOX LOOK */
  border: 1px solid rgba(255,60,60,.22);     /* border of the big container */
  background: rgba(0,0,0,.12);               /* fill behind the neon frame */

  color: var(--hud-muted);
  letter-spacing: .14em;
  text-transform: uppercase;
  font-weight: 800;
  font-size: 12px;
}

  /* =============================
   NAV STUB (TOP MENU): wrap + content-sized pills

  /* Nav stub should not clip wrapped pills (icons/glow/rounded corners) */
  .hudContent > .hudStub:not(.hudMain){
    overflow: visible;
  }

   - WebViews (FB/IG/X) sometimes report wider layout widths, so we must not
     rely on max-width breakpoints to prevent pill pinch/cutoff.
   - Keep HUD MAIN panel styling untouched (.hudStub.hudMain)
   ============================= */
  .hudContent > .hudStub:not(.hudMain){
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: clamp(8px, 2.2vw, 12px);
    padding: 10px 12px;
    text-align: center;
  }

  /* Make pills size to their text (no forced widths) */
  .hudContent > .hudStub:not(.hudMain) .hudIntroText{
    flex: 0 0 auto;
    padding: 6px 14px;
    font-size: clamp(11px, 2.6vw, 13px);
    line-height: 1.05;
  }

  /* Disable ch-based typing width on touch + WebViews (prevents clipped labels) */
  @media (hover: none) and (pointer: coarse){
    .hudIntroType{
      width: auto !important;
      overflow: visible !important;
      animation: none !important;
    }
  }

  body.webview .hudIntroType,
  body.facebook .hudIntroType,
  body.instagram .hudIntroType,
  body.twitter .hudIntroType,
  body.x .hudIntroType{
    width: auto !important;
    overflow: visible !important;
    animation: none !important;
  }


  .hudStub.hudMain{
  border: 1px solid rgba(255,60,60,.32);
  border-radius: var(--hud-radius);

  place-items: start center;
  align-content: start;

  /* was 20px â€” this is the mobile "empty band" */
  padding-top: 8px;
  padding-bottom: 12px;
}


  /* =============================
   HOLOGRAM EMITTER RING (sciâ€‘fi core)
   - confined to the HUD MAIN panel only
   - additive glow + subtle ticks
   ============================= */
  .hudStub.hudMain::before{
    content:"";
    position:absolute;
    inset: 10px 14px;
    border-radius: calc(var(--hud-radius) - 10px);
    pointer-events:none;
    z-index: 1;
    opacity: .38;
    mix-blend-mode: screen;
    background:
      radial-gradient(closest-side at 50% 80%,
        rgba(0,255,255,0.00) 0%,
        rgba(0,255,255,0.00) 56%,
        rgba(0,255,255,0.22) 62%,
        rgba(160,70,255,0.16) 66%,
        rgba(0,0,0,0.00) 74%),
      repeating-conic-gradient(from 90deg at 50% 80%,
        rgba(0,255,255,0.00) 0 14deg,
        rgba(0,255,255,0.18) 14deg 15deg);
    filter:
      blur(0.35px)
      drop-shadow(0 0 14px rgba(0,255,255,0.22))
      drop-shadow(0 0 18px rgba(160,70,255,0.18));
    -webkit-mask: radial-gradient(closest-side at 50% 80%,
      transparent 0 58%,
      #000 60% 66%,
      transparent 68%);
            mask: radial-gradient(closest-side at 50% 80%,
      transparent 0 58%,
      #000 60% 66%,
      transparent 68%);
  }

  /* faint inner field-lines (kept subtle so text stays readable) */
  .hudStub.hudMain::after{
    content:"";
    position:absolute;
    inset: 8px;
    border-radius: calc(var(--hud-radius) - 8px);
    pointer-events:none;
    z-index: 1;
    opacity: .12;
    mix-blend-mode: overlay;
    background:
      repeating-linear-gradient(
        to right,
        rgba(255,255,255,0.00) 0px,
        rgba(255,255,255,0.00) 22px,
        rgba(0,255,255,0.10) 23px,
        rgba(255,255,255,0.00) 24px
      ),
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.00) 0px,
        rgba(255,255,255,0.00) 18px,
        rgba(160,70,255,0.08) 19px,
        rgba(255,255,255,0.00) 20px
      );
  }

  @media (prefers-reduced-motion: reduce){
    .hudStub.hudMain::before,
    .hudStub.hudMain::after{ display:none !important; }
  }

  /* =============================
   PERF: Defer expensive HUD MAIN FX until after initial paint
   - The ::before/::after effects on .hudStub.hudMain are visually great but
     heavy (gradients + masks + blend-modes). By fading them in *after* the
     boot animation, we reduce LCP without changing layout.
   ============================= */
  @keyframes hudMainFxInBefore{
    from{ opacity: 0; }
    to{ opacity: .38; }
  }

  @media (max-width: 520px){
    /* Pull content upward / reduce dead space */
    .hudContent{
      padding: 10px 10px;
      gap: 8px;
      grid-template-rows:  64px auto 1fr;
    }

    /* Keep the main frame + ornaments from getting too tall */
    .neonFrame,
    .hudOrn{
      height: 112px;
    }

    /* Make the inner glass bed fit better on narrow screens */
    .neonFrameTextInner{
      left: 18px;
      right: 18px;
      height: 74%;
      padding: 12px 14px;
    }

    /* Slightly larger, more readable type on mobile */
    .neonFrameTextInner .hudMainType{
      font-size: 13px;
      line-height: 1.35;
      max-width: 32ch;
    }
  }


  /* =============================
   MOBILE FIX (requested): center inner text bed to frame
   ============================= */
  @media (max-width: 520px){
    .neonFrameTextInner{
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      width: calc(100% - 36px); /* matches frame inset */
    }
  }


  
/* =============================
   DESKTOP FIX (requested): widen inner glass bed on LEFT only
   ============================= */
@media (min-width: 521px){
  .neonFrameTextInner{
    left: 28px;   /* widened left edge to align with frame guide */
  }
}



/* =============================
   DESKTOP TUNE: extend inner glass bed 20px to the RIGHT (no reposition)
   ============================= */
@media (min-width: 521px){
  .neonFrameTextInner{
    right: -20px; /* extend width to the right only */
  }
}



/* =============================
   DESKTOP TUNE: widen inner glass bed by 20px (centered; no movement)
   ============================= */
@media (min-width: 521px){
  .neonFrameTextInner{
    width: min(720px, 100%); /* +20px from the original 700px */
  }
}


/* =============================
   MOBILE FIX (requested): lock the inner text bed to the frame geometry
   (previous left/right rules didn't apply because the element wasn't positioned)
   ============================= */
  @media (max-width: 520px){
    /* remove any centering drift from padding on the overlay */
    .neonFrameText{
      padding: 0 !important;
    }

    /* position the inner bed explicitly with equal insets that match the frame opening */
    .neonFrameTextInner{
      position: absolute;

      /* inset tuned to the SVG frame opening (prevents overlap with the end caps) */
      left: clamp(34px, 8vw, 54px);
      right: clamp(34px, 8vw, 54px);
      width: auto !important;

      /* keep it vertically centered in the frame */
      top: 50%;
      transform: translateY(-50%);

      height: 74%;
      padding: 12px 14px !important;
    }
  }
  
  /* =============================
   FINAL MOBILE OVERRIDE:
   keep text wrapping AND keep it inside the frame box
   ============================= */
@media (max-width: 520px){
  /* remove padding drift from the overlay container */
  .neonFrameText{
    padding: 0 !important;
  }

  /* hard-lock the inner bed to the SVG opening */
  .neonFrameTextInner{
    position: absolute !important;

    /* equal insets = centered + stays inside end caps */
    left: clamp(34px, 8vw, 54px) !important;
    right: clamp(34px, 8vw, 54px) !important;
    width: auto !important;

    /* vertically center it in the frame */
    top: 50% !important;
    transform: translateY(-50%) !important;

    /* give it enough vertical room for wrapped lines */
    height: auto !important;
    min-height: 0 !important;
    padding: 12px 14px !important;

    /* allow wrapping */
    overflow: visible !important;
  }

  .neonFrameTextInner .hudMainType,
  .neonFrameTextInner .hudMainTextBox,
  .neonFrameTextInner [data-hud-main-text]{

  #hudRouteSheen{

    transform: translateX(-120%) rotate(-12deg);
    mix-blend-mode: screen;
    filter: blur(0.6px) saturate(1.25);

  #hud.route-sheen #hudRouteSheen{

  @keyframes routeSheenSweep{

    12%  { opacity: 1; }

  }

<script>
  // Fallback boot (for "two-file" deployments):
  // If music-archive.js / hud-app.js are not present, mount the Bands module directly
  // into #hudMainMount by creating #musicContentPanel.
  document.addEventListener('DOMContentLoaded', function () {
    try {
      if (!window.MusicArchive && window.MusicArchiveBands && typeof window.MusicArchiveBands.render === 'function') {
        var mount = document.getElementById('hudMainMount') || document.body;
        var panel = document.getElementById('musicContentPanel');
        if (!panel) {
          panel = document.createElement('div');
          panel.id = 'musicContentPanel';
          if (mount && mount !== document.body) mount.innerHTML = '';
          (mount || document.body).appendChild(panel);
        }
        panel.innerHTML = window.MusicArchiveBands.render();
        if (typeof window.MusicArchiveBands.onMount === 'function') {
          window.MusicArchiveBands.onMount(panel);
        }
      }
    } catch (e) {
      // Keep the shell visible even if something goes wrong
      console.error('Bands fallback mount failed:', e);
    }
  });
</script>
