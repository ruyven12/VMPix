<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>VMPix Archive Explorer Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040308;
      --panel: rgba(12, 8, 18, 0.72);
      --line: rgba(255, 128, 176, 0.16);
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
      --radius-xl: 28px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 170, 212, 0.16), transparent 28%),
        radial-gradient(circle at 18% 84%, rgba(96, 218, 255, 0.1), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(239, 211, 155, 0.08), transparent 26%),
        linear-gradient(180deg, #040308 0%, #090611 42%, #05060c 100%);
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: relative;
      font-family: "Orbitron", Arial, sans-serif;
      touch-action: none;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        linear-gradient(90deg, transparent 0%, rgba(105, 222, 255, 0.03) 50%, transparent 100%),
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.016) 0px,
          rgba(255, 255, 255, 0.016) 1px,
          transparent 5px,
          transparent 10px
        );
      mix-blend-mode: screen;
      opacity: 0.42;
    }

    body::after {
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 114, 181, 0.1) 0 1px, transparent 2px),
        radial-gradient(circle at 78% 26%, rgba(105, 222, 255, 0.08) 0 1px, transparent 2px),
        radial-gradient(circle at 64% 72%, rgba(239, 211, 155, 0.08) 0 1px, transparent 2px);
      background-size: 240px 240px, 300px 300px, 340px 340px;
      opacity: 0.58;
    }

    .mockup-stage {
      position: relative;
      width: min(100%, calc(100% - 8px));
      height: calc(100dvh - 8px);
      margin: 4px auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: #000;
      box-shadow: var(--shadow);
      isolation: isolate;
      touch-action: none;
    }

    .mockup-background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 1;
    }

    .mockup-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: transparent;
      pointer-events: none;
    }

    .mockup-topbar {
      position: absolute;
      top: 18px;
      left: 50%;
      width: auto;
      min-width: 0;
      height: clamp(132px, 10vw, 150px);
      transform: translateX(-50%);
      border-radius: 18px;
      border: 0;
      background: transparent;
      box-shadow: none;
      z-index: 3;
      pointer-events: none;
      opacity: 1;
    }

    .mockup-topbar-logo {
      display: block;
      width: auto;
      height: 100%;
      object-fit: contain;
      object-position: center;
      border-radius: 14px;
      pointer-events: none;
    }

    .mockup-workspace {
      position: absolute;
      top: clamp(126px, 16vh, 168px);
      left: 0;
      right: 0;
      bottom: 0;
      width: auto;
      height: auto;
      border-radius: 24px;
      background: transparent;
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
      overflow: visible;
    }

    .mockup-workspace-copy {
      position: absolute;
      inset: 0;
      pointer-events: auto;
    }

    .mockup-doll-stage {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }

    .mockup-doll-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(700px, 72vmin);
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      overflow: visible;
    }

    .mockup-doll-core img,
    .mockup-doll-core video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .mockup-about-menu {
      position: absolute;
      left: 50%;
      top: calc(50% + min(105px, 10.5vmin));
      width: clamp(240px, 28vw, 360px);
      transform: translate(-50%, 0);
      opacity: 1;
      object-fit: contain;
      pointer-events: none;
      z-index: 3;
      transition: opacity 220ms ease;
      filter:
        drop-shadow(0 0 12px rgba(255, 102, 153, 0.14))
        drop-shadow(0 0 24px rgba(255, 255, 255, 0.06));
    }

    .mockup-about-menu.is-hidden {
      opacity: 0;
    }

    .mockup-about-hitbox {
      position: absolute;
      left: 50%;
      top: calc(50% + min(205px, 20.5vmin));
      width: clamp(96px, 9vw, 112px);
      height: clamp(18px, 1.8vw, 22px);
      transform: translate(-50%, 0);
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      border-radius: 999px;
      cursor: pointer;
      z-index: 4;
      pointer-events: auto;
      -webkit-appearance: none;
      appearance: none;
    }

    .mockup-welcome-copy {
      position: absolute;
      top: calc(50% - min(290px, 29vmin));
      left: 50%;
      width: max-content;
      max-width: min(92%, 760px);
      transform: translateX(-50%);
      text-align: center;
      color: rgba(214, 182, 194, 0.92);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.01em;
      text-wrap: balance;
      text-shadow: 0 0 14px rgba(255, 121, 173, 0.04);
      pointer-events: none;
      z-index: 3;
    }

    @media (max-width: 640px) {
      .mockup-topbar {
        top: 14px;
        height: clamp(128px, 30vw, 138px);
        border-radius: 16px;
      }

      .mockup-workspace {
        top: 110px;
        left: 5px;
        right: 5px;
        bottom: 5px;
        width: auto;
        height: auto;
        border-radius: 20px;
      }

      .mockup-workspace-copy {
        inset: 0;
      }

      .mockup-doll-core {
        width: min(700px, calc(100vw - 36px));
      }

      .mockup-about-menu {
        top: calc(50% + min(43px, 8.6vw));
        width: min(320px, calc(100vw - 56px));
      }

      .mockup-about-hitbox {
        top: calc(50% + min(143px, 28.6vw));
        width: min(108px, 30vw);
        height: min(22px, 6vw);
      }

      .mockup-welcome-copy {
        top: calc(50% - min(208px, 46vw));
        width: max-content;
        max-width: min(92%, 430px);
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="mockup-stage">
    <div class="mockup-topbar" aria-hidden="true">
      <video
        class="mockup-topbar-logo"
        src="archive-system/assets/logo-animated.mp4"
        autoplay
        loop
        muted
        playsinline
        preload="auto"
        aria-hidden="true"
      ></video>
    </div>
    <section class="mockup-workspace" aria-hidden="true">
      <div class="mockup-workspace-copy">
        <div class="mockup-doll-stage">
          <div class="mockup-doll-core">
            <video
              class="mockup-doll-reveal"
              src="archive-system/assets/lightning-doll-reveal.webm"
              muted
              playsinline
              preload="auto"
              aria-hidden="true"
            ></video>
          </div>
          <video
            class="mockup-about-menu"
            src="archive-system/assets/about-menu.webm"
            muted
            playsinline
            preload="auto"
            aria-hidden="true"
          ></video>
          <button
            class="mockup-about-hitbox"
            type="button"
            aria-label="Open About"
          ></button>
        </div>
      </div>
    </section>
    <video
      class="mockup-background-video"
      src="archive-system/assets/background-fire.mp4"
      loop
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
    ></video>
    <div class="mockup-welcome-copy">Welcome to the landing page. Make your selection below.</div>
  </main>
  <script>
    (function () {
      const backgroundVideo = document.querySelector('.mockup-background-video');
      const dollReveal = document.querySelector('.mockup-doll-reveal');
      const aboutMenu = document.querySelector('.mockup-about-menu');
      const aboutHitbox = document.querySelector('.mockup-about-hitbox');
      if (!backgroundVideo || !dollReveal || !aboutMenu || !aboutHitbox) return;
      let isRestarting = false;

      const playAboutMenu = () => {
        aboutMenu.classList.remove('is-hidden');
        try {
          aboutMenu.currentTime = 0;
        } catch (_) {}
        const aboutMenuPromise = aboutMenu.play();
        if (aboutMenuPromise && typeof aboutMenuPromise.catch === 'function') {
          aboutMenuPromise.catch(() => {});
        }
      };

      const restartRevealSequence = () => {
        if (isRestarting) return;
        isRestarting = true;
        aboutMenu.classList.add('is-hidden');
        try {
          aboutMenu.pause();
          aboutMenu.currentTime = 0;
        } catch (_) {}
        try {
          dollReveal.pause();
          dollReveal.currentTime = 0;
        } catch (_) {}
        const revealPromise = dollReveal.play();
        if (revealPromise && typeof revealPromise.catch === 'function') {
          revealPromise.catch(() => {});
        }
        window.setTimeout(() => {
          playAboutMenu();
          isRestarting = false;
        }, 900);
      };

      const playPromise = backgroundVideo.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {});
      }

      try {
        dollReveal.currentTime = 0;
      } catch (_) {}

      const revealPromise = dollReveal.play();
      if (revealPromise && typeof revealPromise.catch === 'function') {
        revealPromise.catch(() => {});
      }

      window.setTimeout(playAboutMenu, 900);

      aboutHitbox.addEventListener('click', () => {
        restartRevealSequence();
      });
    })();
  </script>
</body>
</html>
