<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VMPix Archive Explorer Mockup</title>
  <style>
    :root {
      --bg: #040308;
      --panel: rgba(12, 8, 18, 0.72);
      --line: rgba(255, 128, 176, 0.16);
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
      --radius-xl: 28px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 170, 212, 0.16), transparent 28%),
        radial-gradient(circle at 18% 84%, rgba(96, 218, 255, 0.1), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(239, 211, 155, 0.08), transparent 26%),
        linear-gradient(180deg, #040308 0%, #090611 42%, #05060c 100%);
      overflow: hidden;
    }

    body {
      position: relative;
      font-family: Arial, sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        linear-gradient(90deg, transparent 0%, rgba(105, 222, 255, 0.03) 50%, transparent 100%),
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.016) 0px,
          rgba(255, 255, 255, 0.016) 1px,
          transparent 5px,
          transparent 10px
        );
      mix-blend-mode: screen;
      opacity: 0.42;
    }

    body::after {
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 114, 181, 0.1) 0 1px, transparent 2px),
        radial-gradient(circle at 78% 26%, rgba(105, 222, 255, 0.08) 0 1px, transparent 2px),
        radial-gradient(circle at 64% 72%, rgba(239, 211, 155, 0.08) 0 1px, transparent 2px);
      background-size: 240px 240px, 300px 300px, 340px 340px;
      opacity: 0.58;
    }

    .mockup-stage {
      position: relative;
      width: min(100%, calc(100% - 8px));
      height: calc(100dvh - 8px);
      margin: 4px auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04), transparent 30%),
        linear-gradient(180deg, rgba(24, 11, 21, 0.9), rgba(8, 9, 18, 0.92)),
        var(--panel);
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .mockup-background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .mockup-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 114, 181, 0.08), transparent 32%),
        linear-gradient(180deg, rgba(255, 114, 181, 0.04), transparent 20%);
      pointer-events: none;
    }

    .mockup-topbar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      height: clamp(42px, 4.4vw, 60px);
      border-radius: 18px;
      border: 1px solid rgba(165, 34, 63, 0.78);
      background:
        linear-gradient(180deg, rgba(18, 7, 12, 0.92), rgba(8, 4, 8, 0.94));
      box-shadow:
        inset 0 1px 0 rgba(255, 179, 202, 0.08),
        0 10px 22px rgba(0, 0, 0, 0.34);
      z-index: 3;
      pointer-events: none;
    }

    .mockup-topbar-logo {
      position: absolute;
      top: 2px;
      right: 5px;
      width: 210px;
      height: calc(100% - 4px);
      object-fit: fill;
      object-position: right center;
      border-radius: 14px;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .mockup-topbar {
        height: clamp(38px, 11vw, 48px);
        border-radius: 16px;
      }

      .mockup-topbar-logo {
        width: 150px;
      }
    }
  </style>
</head>
<body>
  <main class="mockup-stage">
    <div class="mockup-topbar" aria-hidden="true">
      <video
        class="mockup-topbar-logo"
        src="archive-system/assets/logo-animated.mp4"
        autoplay
        loop
        muted
        playsinline
        preload="auto"
        aria-hidden="true"
      ></video>
    </div>
    <video
      class="mockup-background-video"
      src="archive-system/assets/background-fire.mp4"
      autoplay
      loop
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
    ></video>
  </main>
</body>
</html>
