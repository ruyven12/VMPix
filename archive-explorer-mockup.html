<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>VMPix Archive Explorer Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040308;
      --panel: rgba(12, 8, 18, 0.72);
      --line: rgba(255, 128, 176, 0.16);
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
      --radius-xl: 28px;
      --about-crop-left: 31%;
      --about-crop-right: 31%;
      --about-crop-top: 40%;
      --about-crop-bottom: 43%;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 170, 212, 0.16), transparent 28%),
        radial-gradient(circle at 18% 84%, rgba(96, 218, 255, 0.1), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(239, 211, 155, 0.08), transparent 26%),
        linear-gradient(180deg, #040308 0%, #090611 42%, #05060c 100%);
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: relative;
      font-family: "Orbitron", Arial, sans-serif;
      touch-action: none;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        linear-gradient(90deg, transparent 0%, rgba(105, 222, 255, 0.03) 50%, transparent 100%),
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.016) 0px,
          rgba(255, 255, 255, 0.016) 1px,
          transparent 5px,
          transparent 10px
        );
      mix-blend-mode: screen;
      opacity: 0.42;
    }

    body::after {
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 114, 181, 0.1) 0 1px, transparent 2px),
        radial-gradient(circle at 78% 26%, rgba(105, 222, 255, 0.08) 0 1px, transparent 2px),
        radial-gradient(circle at 64% 72%, rgba(239, 211, 155, 0.08) 0 1px, transparent 2px);
      background-size: 240px 240px, 300px 300px, 340px 340px;
      opacity: 0.58;
    }

    .mockup-stage {
      position: relative;
      width: min(100%, calc(100% - 8px));
      height: calc(100dvh - 8px);
      margin: 4px auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: #000;
      box-shadow: var(--shadow);
      isolation: isolate;
      touch-action: none;
    }

    .mockup-rotate-guard {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 170, 212, 0.12), transparent 28%),
        linear-gradient(180deg, rgba(4, 3, 8, 0.96) 0%, rgba(4, 3, 8, 0.99) 100%);
      color: rgba(245, 232, 238, 0.96);
      font-family: "Orbitron", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      letter-spacing: 0.04em;
    }

    .mockup-rotate-guard-copy {
      max-width: 320px;
      padding: 18px 20px;
      border: 1px solid rgba(255, 140, 180, 0.2);
      border-radius: 18px;
      background: rgba(10, 8, 14, 0.82);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .mockup-background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 1;
    }

    .mockup-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: transparent;
      pointer-events: none;
    }

    .mockup-topbar {
      position: absolute;
      top: 18px;
      left: 50%;
      width: auto;
      min-width: 0;
      height: clamp(132px, 10vw, 150px);
      transform: translateX(-50%);
      border-radius: 18px;
      border: 0;
      background: transparent;
      box-shadow: none;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      transition: opacity 420ms ease;
    }

    .mockup-topbar.is-visible {
      opacity: 1;
    }

    .mockup-topbar-logo {
      display: block;
      width: auto;
      height: 100%;
      object-fit: contain;
      object-position: center;
      border-radius: 14px;
      pointer-events: none;
    }

    .mockup-workspace {
      position: absolute;
      top: clamp(126px, 16vh, 168px);
      left: 0;
      right: 0;
      bottom: 0;
      width: auto;
      height: auto;
      border-radius: 24px;
      background: transparent;
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
      overflow: visible;
    }

    .mockup-workspace-copy {
      position: absolute;
      inset: 0;
      pointer-events: auto;
    }

    .mockup-doll-stage {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }

    .mockup-doll-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(700px, 72vmin);
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      overflow: visible;
    }

    .mockup-doll-core img,
    .mockup-doll-core video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .mockup-about-slot {
      position: absolute;
      left: 50%;
      top: calc(50% + min(105px, 10.5vmin));
      width: clamp(240px, 28vw, 360px);
      display: grid;
      transform: translate(-50%, 0);
      transform-origin: center center;
      z-index: 3;
      pointer-events: auto;
    }

    .mockup-about-menu,
    .mockup-about-menu-reverse {
      grid-area: 1 / 1;
      display: block;
      width: 100%;
      opacity: 1;
      object-fit: contain;
      pointer-events: none;
      transition: opacity 220ms ease;
      filter:
        drop-shadow(0 0 12px rgba(255, 102, 153, 0.14))
        drop-shadow(0 0 24px rgba(255, 255, 255, 0.06));
    }

    .mockup-about-menu.is-hidden,
    .mockup-about-menu-reverse.is-hidden {
      opacity: 0;
    }

    .mockup-about-hitbox {
      grid-area: 1 / 1;
      position: absolute;
      left: var(--about-crop-left);
      right: var(--about-crop-right);
      top: calc(var(--about-crop-top) + 5px);
      bottom: var(--about-crop-bottom);
      transform: none;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      border-radius: 0;
      cursor: pointer;
      z-index: 4;
      pointer-events: auto;
      -webkit-appearance: none;
      appearance: none;
    }

    .mockup-welcome-copy {
      position: absolute;
      top: calc(50% - min(290px, 29vmin));
      left: 50%;
      width: max-content;
      max-width: min(92%, 760px);
      transform: translateX(-50%);
      text-align: center;
      color: rgba(214, 182, 194, 0.92);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.01em;
      text-wrap: balance;
      text-shadow: 0 0 14px rgba(255, 121, 173, 0.04);
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      overflow: hidden;
      clip-path: inset(100% 0 0 0);
    }

    .mockup-welcome-copy::after {
      content: "";
      position: absolute;
      inset: -10% 0;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 232, 244, 0.6) 48%,
        rgba(255, 255, 255, 0) 100%
      );
      opacity: 0;
      transform: translateY(-120%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .mockup-welcome-copy.is-visible {
      animation: mockup-copy-scroll-reveal 560ms cubic-bezier(0.19, 0.72, 0.18, 1) forwards;
    }

    .mockup-welcome-copy.is-visible::after {
      animation: mockup-copy-scan 560ms cubic-bezier(0.19, 0.72, 0.18, 1) forwards;
    }

    .mockup-welcome-copy.is-hidden {
      opacity: 0;
      transition: opacity 180ms ease;
    }

    @keyframes mockup-copy-scroll-reveal {
      0% {
        opacity: 0;
        clip-path: inset(100% 0 0 0);
        transform: translateX(-50%) translateY(8px);
      }
      45% {
        opacity: 0.9;
      }
      100% {
        opacity: 1;
        clip-path: inset(0 0 0 0);
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes mockup-copy-scan {
      0% {
        opacity: 0;
        transform: translateY(-120%);
      }
      20% {
        opacity: 0.85;
      }
      100% {
        opacity: 0;
        transform: translateY(120%);
      }
    }

    @media (max-width: 640px) {
      .mockup-topbar {
        top: 14px;
        height: clamp(128px, 30vw, 138px);
        border-radius: 16px;
      }

      .mockup-workspace {
        top: 110px;
        left: 5px;
        right: 5px;
        bottom: 5px;
        width: auto;
        height: auto;
        border-radius: 20px;
      }

      .mockup-workspace-copy {
        inset: 0;
      }

      .mockup-doll-core {
        width: min(700px, calc(100vw - 36px));
      }

      .mockup-about-menu {
        width: 100%;
      }

      .mockup-about-slot {
        top: calc(50% + min(43px, 8.6vw));
        width: min(320px, calc(100vw - 56px));
      }

      .mockup-welcome-copy {
        top: calc(50% - min(208px, 46vw));
        width: max-content;
        max-width: min(92%, 430px);
        font-size: 16px;
      }
    }

    @media (max-width: 932px) and (orientation: landscape) {
      .mockup-stage {
        display: none;
      }

      .mockup-rotate-guard {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <main class="mockup-stage">
    <div class="mockup-topbar" aria-hidden="true">
      <video
        class="mockup-topbar-logo"
        src="assets/logo-animated.mp4"
        autoplay
        loop
        muted
        playsinline
        preload="auto"
        aria-hidden="true"
      ></video>
    </div>
    <section class="mockup-workspace" aria-hidden="true">
      <div class="mockup-workspace-copy">
        <div class="mockup-doll-stage">
          <div class="mockup-doll-core">
            <video
              class="mockup-doll-reveal"
              src="assets/lightning-doll-reveal.webm"
              muted
              playsinline
              preload="auto"
              aria-hidden="true"
            ></video>
          </div>
          <div class="mockup-about-slot">
            <video
              class="mockup-about-menu"
              src="assets/about-menu.webm"
              muted
              playsinline
              preload="auto"
              aria-hidden="true"
            ></video>
            <video
              class="mockup-about-menu-reverse is-hidden"
              src="assets/about-menu-reverse.webm"
              muted
              playsinline
              preload="auto"
              aria-hidden="true"
            ></video>
            <button
              class="mockup-about-hitbox"
              type="button"
              aria-label="Open About"
            ></button>
          </div>
        </div>
      </div>
    </section>
    <video
      class="mockup-background-video"
      src="assets/background-fire.mp4"
      loop
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
    ></video>
    <div class="mockup-welcome-copy">Welcome to the landing page. Make your selection below.</div>
  </main>
  <div class="mockup-rotate-guard" aria-hidden="true">
    <div class="mockup-rotate-guard-copy">This mockup is portrait only on mobile. Rotate your device back upright to continue.</div>
  </div>
  <script>
    (function () {
      if (window.screen && window.screen.orientation && typeof window.screen.orientation.lock === 'function') {
        window.screen.orientation.lock('portrait').catch(() => {});
      }

      const topbar = document.querySelector('.mockup-topbar');
      const backgroundVideo = document.querySelector('.mockup-background-video');
      const dollReveal = document.querySelector('.mockup-doll-reveal');
      const aboutMenu = document.querySelector('.mockup-about-menu');
      const aboutMenuReverse = document.querySelector('.mockup-about-menu-reverse');
      const aboutSlot = document.querySelector('.mockup-about-slot');
      const aboutHitbox = document.querySelector('.mockup-about-hitbox');
      const welcomeCopy = document.querySelector('.mockup-welcome-copy');
      if (!topbar || !backgroundVideo || !dollReveal || !aboutMenu || !aboutMenuReverse || !aboutSlot || !aboutHitbox) return;
      let isTransitioning = false;

      const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

      const playVideoFromStart = (video, playbackRate = 1) => {
        if (!video) return Promise.resolve();
        try {
          video.currentTime = 0;
          video.playbackRate = playbackRate;
        } catch (_) {}
        const playPromise = video.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          return playPromise.catch(() => {});
        }
        return Promise.resolve();
      };

      const waitForVideoEnd = (video, fallbackMs) =>
        new Promise((resolve) => {
          if (!video) {
            resolve();
            return;
          }
          let settled = false;
          let timeoutId = 0;
          const done = () => {
            if (settled) return;
            settled = true;
            video.removeEventListener('ended', done);
            if (timeoutId) window.clearTimeout(timeoutId);
            resolve();
          };
          video.addEventListener('ended', done, { once: true });
          timeoutId = window.setTimeout(done, fallbackMs);
        });

      const playAboutMenu = () => {
        aboutMenu.classList.remove('is-hidden');
        aboutMenuReverse.classList.add('is-hidden');
        try {
          aboutMenu.currentTime = 0;
        } catch (_) {}
        try {
          aboutMenuReverse.pause();
          aboutMenuReverse.currentTime = 0;
        } catch (_) {}
        const aboutMenuPromise = playVideoFromStart(aboutMenu);
        if (aboutMenuPromise && typeof aboutMenuPromise.catch === 'function') {
          aboutMenuPromise.catch(() => {});
        }
      };

      const openAboutSequence = async () => {
        if (isTransitioning) return;
        isTransitioning = true;
        aboutHitbox.disabled = true;
        if (welcomeCopy) {
          welcomeCopy.classList.add('is-hidden');
        }
        aboutMenu.classList.add('is-hidden');
        aboutMenuReverse.classList.remove('is-hidden');
        try {
          aboutMenu.pause();
        } catch (_) {}
        await playVideoFromStart(aboutMenuReverse, 2.5);
        await waitForVideoEnd(aboutMenuReverse, 200);
      };

      const playPromise = backgroundVideo.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {});
      }

      try {
        dollReveal.currentTime = 0;
      } catch (_) {}

      const revealPromise = dollReveal.play();
      if (revealPromise && typeof revealPromise.catch === 'function') {
        revealPromise.catch(() => {});
      }

      window.setTimeout(() => {
        topbar.classList.add('is-visible');
      }, 520);

      window.setTimeout(() => {
        if (welcomeCopy) {
          welcomeCopy.classList.add('is-visible');
        }
      }, 760);

      window.setTimeout(playAboutMenu, 900);

      aboutHitbox.addEventListener('click', () => {
        openAboutSequence();
      });
    })();
  </script>
</body>
</html>
