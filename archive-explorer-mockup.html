<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VMPix Archive Explorer Mockup</title>
  <style>
    :root {
      --bg: #040308;
      --panel: rgba(12, 8, 18, 0.72);
      --line: rgba(255, 128, 176, 0.16);
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
      --radius-xl: 28px;
      --start-hitbox-offset-x: -27px;
      --start-hitbox-offset-y: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 170, 212, 0.16), transparent 28%),
        radial-gradient(circle at 18% 84%, rgba(96, 218, 255, 0.1), transparent 24%),
        radial-gradient(circle at 82% 18%, rgba(239, 211, 155, 0.08), transparent 26%),
        linear-gradient(180deg, #040308 0%, #090611 42%, #05060c 100%);
      overflow: hidden;
    }

    body {
      position: relative;
      font-family: Arial, sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        linear-gradient(90deg, transparent 0%, rgba(105, 222, 255, 0.03) 50%, transparent 100%),
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.016) 0px,
          rgba(255, 255, 255, 0.016) 1px,
          transparent 5px,
          transparent 10px
        );
      mix-blend-mode: screen;
      opacity: 0.42;
    }

    body::after {
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 114, 181, 0.1) 0 1px, transparent 2px),
        radial-gradient(circle at 78% 26%, rgba(105, 222, 255, 0.08) 0 1px, transparent 2px),
        radial-gradient(circle at 64% 72%, rgba(239, 211, 155, 0.08) 0 1px, transparent 2px);
      background-size: 240px 240px, 300px 300px, 340px 340px;
      opacity: 0.58;
    }

    .mockup-stage {
      position: relative;
      width: min(100%, calc(100% - 8px));
      height: calc(100dvh - 8px);
      margin: 4px auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: #000;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .mockup-background-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 0;
      transition: opacity 700ms ease;
    }

    .mockup-background-video.is-active {
      opacity: 1;
    }

    .mockup-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: transparent;
      pointer-events: none;
    }

    .mockup-topbar {
      position: absolute;
      top: 18px;
      left: 50%;
      width: auto;
      min-width: 0;
      height: clamp(82px, 7vw, 100px);
      transform: translateX(-50%);
      border-radius: 18px;
      border: 0;
      background: transparent;
      box-shadow: none;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1500ms ease;
    }

    .mockup-topbar.is-active {
      opacity: 1;
    }

    .mockup-topbar-logo {
      display: block;
      width: auto;
      height: 100%;
      object-fit: contain;
      object-position: center;
      border-radius: 14px;
      pointer-events: none;
    }

    .mockup-workspace {
      position: absolute;
      top: clamp(126px, 16vh, 168px);
      left: 0;
      right: 0;
      bottom: 0;
      width: auto;
      height: auto;
      border-radius: 24px;
      background: rgba(6, 3, 8, 0.18);
      box-shadow:
        inset 0 0 0 1px rgba(255, 96, 146, 0.16),
        inset 0 0 46px rgba(255, 96, 146, 0.05);
      opacity: 0;
      transition: opacity 1500ms ease;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .mockup-workspace.is-active {
      opacity: 1;
    }

    .mockup-workspace::before,
    .mockup-workspace::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .mockup-workspace::before {
      border: 1px solid rgba(153, 34, 68, 0.82);
      box-shadow:
        0 0 18px rgba(255, 86, 135, 0.08),
        inset 0 0 22px rgba(255, 86, 135, 0.04);
    }

    .mockup-workspace::after {
      inset: 10px;
      border: 1px solid rgba(255, 114, 181, 0.12);
      animation: mockupWorkspaceBreath 4.8s ease-in-out infinite;
    }

    .mockup-workspace-border {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      overflow: hidden;
    }

    .mockup-workspace-border::before,
    .mockup-workspace-border::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .mockup-workspace-border::before {
      top: -1px;
      left: -14%;
      width: 28%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 120, 176, 0.92), transparent);
      filter: blur(0.2px);
      animation: mockupWorkspaceSweepX 6.4s linear infinite;
    }

    .mockup-workspace-border::after {
      top: -14%;
      right: -1px;
      width: 2px;
      height: 28%;
      background: linear-gradient(180deg, transparent, rgba(105, 222, 255, 0.85), transparent);
      filter: blur(0.2px);
      animation: mockupWorkspaceSweepY 5.8s linear infinite;
    }

    .mockup-workspace-copy {
      position: absolute;
      top: clamp(26px, 4vh, 42px);
      left: 50%;
      width: min(86%, 760px);
      transform: translateX(-50%);
      text-align: center;
      color: rgba(255, 224, 233, 0.72);
      font-size: clamp(18px, 2vw, 28px);
      line-height: 1.35;
      letter-spacing: 0.03em;
      text-wrap: balance;
      text-shadow: 0 0 18px rgba(255, 121, 173, 0.06);
    }

    .mockup-workspace-copy strong {
      display: block;
      margin-bottom: 12px;
      font-size: clamp(22px, 2.4vw, 34px);
      color: rgba(255, 229, 236, 0.82);
      font-weight: 700;
    }

    .mockup-start-button {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(1020px, 106vw, 1320px);
      transform: translate(-50%, -50%) scale(var(--start-button-scale, 1));
      transform-origin: center center;
      opacity: var(--start-button-opacity, 0);
      object-fit: contain;
      pointer-events: none;
      z-index: 2;
      transition: opacity 1200ms ease-out;
      filter:
        drop-shadow(0 0 18px rgba(255, 114, 181, 0.18))
        drop-shadow(0 0 38px rgba(105, 222, 255, 0.12));
    }

    .mockup-start-button.is-hidden {
      visibility: hidden;
    }

    .mockup-start-button.is-exiting {
      animation: mockupStartButtonExit 620ms ease forwards;
    }

    .mockup-start-button-hitbox {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      transform:
        translate(-50%, -50%)
        translate(var(--start-hitbox-offset-x), var(--start-hitbox-offset-y))
        scale(var(--start-button-scale, 1));
      transform-origin: center center;
      border: 0;
      border-radius: 50%;
      padding: 0;
      margin: 0;
      background: transparent;
      opacity: var(--start-button-opacity, 0);
      cursor: pointer;
      z-index: 4;
      transition: opacity 1200ms ease-out;
      -webkit-appearance: none;
      appearance: none;
    }

    .mockup-start-button-hitbox.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .mockup-start-button-hitbox.is-exiting {
      animation: mockupStartHitboxExit 620ms ease forwards;
      pointer-events: none;
    }

    @keyframes mockupStartButtonExit {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(0.04);
        opacity: 0;
      }
    }

    @keyframes mockupStartHitboxExit {
      0% {
        transform:
          translate(-50%, -50%)
          translate(var(--start-hitbox-offset-x), var(--start-hitbox-offset-y))
          scale(1);
        opacity: 1;
      }
      100% {
        transform:
          translate(-50%, -50%)
          translate(var(--start-hitbox-offset-x), var(--start-hitbox-offset-y))
          scale(0.04);
        opacity: 0;
      }
    }

    @keyframes mockupWorkspaceBreath {
      0%, 100% {
        opacity: 0.48;
        box-shadow: inset 0 0 18px rgba(255, 114, 181, 0.04);
      }
      50% {
        opacity: 0.9;
        box-shadow: inset 0 0 26px rgba(255, 114, 181, 0.08);
      }
    }

    @keyframes mockupWorkspaceSweepX {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(460%);
      }
    }

    @keyframes mockupWorkspaceSweepY {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(460%);
      }
    }

    @media (max-width: 640px) {
      :root {
        --start-hitbox-offset-x: -25px;
        --start-hitbox-offset-y: 22px;
      }

      .mockup-topbar {
        top: 14px;
        height: clamp(78px, 21vw, 88px);
        border-radius: 16px;
      }

      .mockup-workspace {
        top: 110px;
        left: 5px;
        right: 5px;
        bottom: 5px;
        width: auto;
        height: auto;
        border-radius: 20px;
      }

      .mockup-workspace-copy {
        top: 24px;
        width: min(90%, 380px);
        font-size: clamp(15px, 4.4vw, 20px);
      }

      .mockup-workspace-copy strong {
        font-size: clamp(18px, 5.2vw, 24px);
      }

      .mockup-start-button {
        width: clamp(760px, 160vw, 980px);
      }

      .mockup-start-button-hitbox {
        width: 78px;
        height: 78px;
      }
    }
  </style>
</head>
<body>
  <main class="mockup-stage">
    <div class="mockup-topbar" aria-hidden="true">
      <video
        class="mockup-topbar-logo"
        src="archive-system/assets/logo-animated.mp4"
        autoplay
        loop
        muted
        playsinline
        preload="auto"
        aria-hidden="true"
      ></video>
    </div>
    <section class="mockup-workspace" aria-hidden="true">
      <div class="mockup-workspace-border"></div>
      <div class="mockup-workspace-copy">
        <strong>Welcome to Voodoo Media.</strong>
        This working area can become the live landing panel. The border can stay active and responsive while the content inside changes by section, state, or route.
      </div>
    </section>
    <video
      class="mockup-background-video"
      src="archive-system/assets/background-fire.mp4"
      loop
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
    ></video>
    <video
      class="mockup-start-button"
      src="archive-system/assets/start-button.webm"
      autoplay
      loop
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
    ></video>
    <button
      class="mockup-start-button-hitbox"
      type="button"
      aria-label="Start"
    ></button>
  </main>
  <script>
    (function () {
      const backgroundVideo = document.querySelector('.mockup-background-video');
      const topbar = document.querySelector('.mockup-topbar');
      const workspace = document.querySelector('.mockup-workspace');
      const startButton = document.querySelector('.mockup-start-button');
      const startButtonHitbox = document.querySelector('.mockup-start-button-hitbox');
      if (!backgroundVideo || !topbar || !workspace || !startButton || !startButtonHitbox) return;

      let hidden = false;

      window.setTimeout(() => {
        startButton.style.setProperty('--start-button-opacity', '1');
        startButtonHitbox.style.setProperty('--start-button-opacity', '1');
      }, 120);

      window.setTimeout(() => {
        startButton.style.transition = 'opacity 700ms ease';
        startButtonHitbox.style.transition = 'opacity 700ms ease';
      }, 1400);

      startButtonHitbox.addEventListener('click', () => {
        if (hidden) return;
        hidden = true;
        startButtonHitbox.classList.add('is-exiting');
        startButton.classList.add('is-exiting');
      });

      startButton.addEventListener('animationend', (event) => {
        if (event.animationName !== 'mockupStartButtonExit') return;
        startButton.classList.add('is-hidden');
        startButtonHitbox.classList.add('is-hidden');
        backgroundVideo.classList.add('is-active');
        topbar.classList.add('is-active');
        workspace.classList.add('is-active');
        const playPromise = backgroundVideo.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {});
        }
      });
    })();
  </script>
</body>
</html>
